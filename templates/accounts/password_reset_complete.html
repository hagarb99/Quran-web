{% extends 'base.html' %}

{% block title %}تم تغيير كلمة المرور بنجاح - منصة حلقات{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom shadow-sm border-0 text-center p-4 p-md-5">
                <div class="card-halaqa-top-bar"></div>
                <div class="avatar-circle mx-auto mb-3" style="width: 64px; height: 64px; background: var(--primary-light);">
                    <i class="bi bi-check-circle-fill text-primary fs-2"></i>
                </div>
                <h4 class="fw-bold text-primary-dark mb-2">تم تعيين كلمة المرور بنجاح!</h4>
                <p class="text-muted small mb-4">
                    تم تحديث كلمة المرور الخاصة بحسابك بأمان. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.
                </p>

                <div>
                    <a href="{% url 'accounts:login' %}" class="btn btn-gold-custom w-100 py-2 fs-6 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i> الانتقال لتسجيل الدخول
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
