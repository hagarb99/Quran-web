{% extends 'base.html' %}

{% block title %}حذف الموعد الأسبوعي{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom border-danger">
                <div class="card-header bg-danger-subtle text-danger py-3 fw-bold">
                    <i class="bi bi-trash-fill me-2"></i> تأكيد حذف الموعد
                </div>
                <div class="card-body p-4 text-center">
                    <p class="mb-3">هل أنت متأكد من حذف موعد <strong>{{ schedule.get_day_of_week_display }} ({{ schedule.start_time|time:"H:i" }} - {{ schedule.end_time|time:"H:i" }})</strong>؟</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <button type="submit" class="btn btn-danger px-4">نعم، احذف الموعد</button>
                            <a href="{% url 'halaqat:detail' halaqa.id %}" class="btn btn-outline-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
